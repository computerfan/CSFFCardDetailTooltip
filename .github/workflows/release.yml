name: Publish release

on:
  workflow_run:
    workflows: [Build Windows mod]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful tag build run ID to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}
    steps:
      # Always use trusted default-branch code, never code from a triggering PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify successful tag build
        id: release
        run: |
          if ($env:BUILD_RUN_ID -notmatch '^\d+$') { throw 'Invalid build run ID.' }
          $json = gh api "repos/$env:GH_REPO/actions/runs/$env:BUILD_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read build run.' }
          $run = $json | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/dotnet.yml' -or $run.event -ne 'push' -or
              $run.conclusion -ne 'success' -or $run.head_repository.full_name -ne $env:GH_REPO) {
            throw 'Only a successful push build from this repository may publish a release.'
          }
          $tag = $run.head_branch
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Build must target a release tag.' }
          $commit = git rev-parse --verify "refs/tags/$tag^{commit}"
          if ($LASTEXITCODE -ne 0 -or $commit -ne $run.head_sha) { throw 'Tag does not match build commit.' }
          $projectText = git show "${commit}:CSFFCardDetailTooltip.csproj"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read tagged project version.' }
          $project = [xml]($projectText -join "`n")
          $versions = @($project.Project.PropertyGroup.Version | Where-Object { $_ })
          if ($versions.Count -ne 1 -or "v$($versions[0])" -cne $tag) { throw 'Tag and project version differ.' }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($versions[0])" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Download verified build artifact and prepare release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          $artifact = "CSFFCardDetailTooltip-$env:RELEASE_VERSION-openbetabranch"
          gh run download $env:BUILD_RUN_ID --name $artifact --dir release-package
          if ($LASTEXITCODE -ne 0) { throw 'Cannot download the tag build artifact.' }
          $info = Get-Content release-package/game-build.json -Raw | ConvertFrom-Json
          if ($info.commit -ne $env:RELEASE_COMMIT -or $info.packageVersion -ne $env:RELEASE_VERSION -or
              $info.pluginVersion -ne $env:RELEASE_VERSION -or $info.branch -ne 'openbetabranch') {
            throw 'Artifact provenance does not match the release.'
          }
          $files = @('CSFFCardDetailTooltip.dll', 'README.md', 'LICENSE', 'game-build.json')
          foreach ($file in $files) {
            if (!(Test-Path -LiteralPath "release-package/$file" -PathType Leaf)) { throw "Missing release file: $file" }
          }
          Compress-Archive -LiteralPath ($files | ForEach-Object { "release-package/$_" }) -DestinationPath "CSFFCardDetailTooltip-$env:RELEASE_VERSION.zip"
          ./tools/Get-ReleaseNotes.ps1 -Tag $env:RELEASE_TAG -OutputPath release-notes.md
      - name: Publish GitHub release
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          # Leave an already published release and its assets intact on retries.
          $existing = gh release view $env:RELEASE_TAG --json isDraft,url 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (!$release.isDraft) {
              "Release already published: $($release.url)" >> $env:GITHUB_STEP_SUMMARY
              exit 0
            }
            throw 'A draft already exists for this tag; resolve it before automatic publishing.'
          }
          gh release create $env:RELEASE_TAG "CSFFCardDetailTooltip-$env:RELEASE_VERSION.zip" --verify-tag --title $env:RELEASE_TAG --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
          "Published https://github.com/$env:GH_REPO/releases/tag/$env:RELEASE_TAG" >> $env:GITHUB_STEP_SUMMARY
